name: Validate Agent Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill structure and metadata
        run: python scripts/validate_skills.py

      - name: Validate routing evaluations and scenarios
        run: python scripts/validate_evaluations.py

      - name: Check shell syntax
        run: |
          bash -n scripts/install-codex.sh
          bash -n scripts/install-antigravity.sh
          bash -n scripts/test_installers.sh

      - name: Compile Python examples
        run: python -m compileall -q skills

      - name: Compile validation and eval scripts
        run: python -m py_compile scripts/*.py

      - name: Dry-run model eval harness
        run: python scripts/run_model_evals.py --provider codex --dry-run --limit 1 >/dev/null

      - name: Test installers
        run: bash scripts/test_installers.sh
